name: Nightly database backup

# Runs at 02:00 Bangkok time (19:00 UTC) every night, and on demand from the Actions tab (Run workflow).
# Setup and restore steps: docs/backup-and-restore.md
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the backup script
        uses: actions/checkout@v4

      # The Supabase server runs PostgreSQL 17, and pg_dump must be the same version or newer.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # The runner already has a PostgreSQL 16 client first on PATH, and installing 17 does not replace it.
      # Point every client tool at the 17 binaries (/usr/local/bin comes before /usr/bin), put them first on PATH
      # for the next step, and stop here if pg_dump is still not 17.
      - name: Use the PostgreSQL 17 client
        run: |
          for tool in pg_dump pg_restore psql; do
            sudo ln -sf "/usr/lib/postgresql/17/bin/${tool}" "/usr/local/bin/${tool}"
          done
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          hash -r
          command -v pg_dump
          pg_dump --version
          pg_dump --version | grep -q "(PostgreSQL) 17\." || { echo "pg_dump is not version 17" >&2; exit 1; }

      - name: Dump, encrypt and upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
        run: bash scripts/backup/db-backup.sh
